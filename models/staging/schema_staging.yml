version: 2

models:
  - name: stg_sales_fact
    description: "Incremental sales fact table with deduplicated order records and enforced schema contract. New Records only Append"
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns: [order_id]
    columns:
      - name: order_id
        data_type: VARCHAR
        description: "Primary Key: Unique identifier for each sales order."
        tests:
          - unique
          - not_null
      - name: product_id
        data_type: VARCHAR
        description: "Foreign Key: Reference to the product master table."
        constraints:
          - type: not_null
        tests:
          - not_null
          - relationships:
              to: ref('stg_product_category')
              field: product_id
      - name: customer_id
        data_type: VARCHAR
        description: "Foreign Key: Reference to the customer master table."
        constraints:
          - type: not_null
        tests:
          - not_null
          - relationships:
              to: ref('stg_customer')
              field: customer_id
      - name: order_date
        data_type: DATE
        description: "The date the order was placed."
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: order_quantity
        data_type: BIGINT
        description: "The number of items purchased in the order."
        tests:
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: order_amount
        data_type: DECIMAL(10,2)
        description: "monetary value of the order 1 quantity."
      - name: payment_method
        data_type: VARCHAR
        description: "The method used for payment (e.g., credit_card, paypal)."
        tests:
          - not_empty_string
          - accepted_values:
              values: ['credit_card', 'debit_card', 'paypal', 'bank_transfer']
      - name: discount_applied
        data_type: DECIMAL(10,2)
        description: "Monetary discount amount applied to the order."
        tests:
          - not_null
      - name: shipping_cost
        data_type: DECIMAL(10,2)
        description: "Cost associated with shipping the order."
        tests:
          - not_null
      - name: created_at
        data_type: TIMESTAMP
        description: "Timestamp when the record was created in the source system."
        tests:
          - not_null

  - name: stg_product_category
    description: "Incrmental product and category dimension table with full attribute mapping. Incremental Merge Startegy on Product Id"
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns: [product_id]
    columns:
      - name: product_id
        data_type: VARCHAR
        description: "Primary Key: Unique identifier for each product & category combination."
        tests:
          - unique
          - not_null
      - name: category_id
        data_type: VARCHAR
        description: "Unique identifier for the product category."
        tests:
          - not_null
      - name: category_name
        data_type: VARCHAR
        description: "name of the category."
        tests:
          - not_empty_string
      - name: subcategory
        data_type: VARCHAR
        description: "Specific sub-classification of the product."
      - name: brand
        data_type: VARCHAR
        description: "The manufacturer or brand name of the product."
      - name: supplier_id
        data_type: VARCHAR
        description: "Reference identifier for the product supplier."
      - name: cost_price
        data_type: DECIMAL(10,2)
        description: "The internal cost to acquire the product."
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: retail_price
        data_type: DECIMAL(10,2)
        description: "The selling price of the product to customers."
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: margin_percent
        data_type: DECIMAL(10,2)
        description: "The calculated profit margin percentage."
      - name: stock_level
        data_type: DECIMAL(10,2)
        description: "The current quantity of items in inventory."
      - name: reorder_point
        data_type: DECIMAL(10,2)
        description: "The inventory threshold that triggers a restock order."
      - name: discontinued
        data_type: BOOLEAN
        description: "Flag indicating if the product is no longer being sold."
      - name: launch_date
        data_type: DATE
        description: "The date the product was first introduced."
      - name: last_updated
        data_type: DATE
        description: "The date the record was last modified in the source system."
        constraints:
          - type: not_null
        tests:
          - not_null

  - name: stg_customer
    description: "Incremental Customer table containing name, email and status information. Incremental Merge Startegy on Customer Id."
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns: [customer_id]
    columns:
      - name: customer_id
        data_type: VARCHAR
        description: "Primary Key: Unique identifier for each customer."
        tests:
          - unique
          - not_null
      - name: customer_name
        data_type: VARCHAR
        description: "The full name of the customer."
        constraints:
          - type: not_null
        tests:
          - not_null
          - not_empty_string
      - name: customer_email
        data_type: VARCHAR
        description: "The primary email address for customer contact."
        meta:
          is_pii: true
        constraints:
          - type: not_null
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "LIKE '%@%'"
      - name: start_date
        data_type: DATE
        description: "The date the customer record became active."
      - name: end_date
        data_type: DATE
        description: "The date the customer record was deactivated or expired."
      - name: status
        data_type: VARCHAR
        description: "The current status of the customer (e.g., Active, Inactive)."
      - name: loaded_at_dbt
        data_type: TIMESTAMPTZ
        description: "The timestamp when the record was processed by the dbt pipeline. Not source system field."
        constraints:
          - type: not_null
        tests:
          - not_null